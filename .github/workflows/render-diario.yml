name: Render diario

# Saca el render del camino critico de una sesion de Claude.
#
# POR QUE: al 19/09/2026 el render vivia dentro de una llamada `sandbox_exec`, de a 3 piezas por
# vez (tope de 16.000 caracteres del comando; cada upload_url presignada mide ~2.400). Para 10
# piezas diarias son 4 llamadas encadenadas dentro de una sesion que, medido, ABANDONA. Aqui el
# runner corre solo, con internet sin proxy (docs/RED-Y-BLOQUEOS.md) y sin tope de caracteres:
# las upload_url viajan en un archivo del repo, no dentro de un comando.
#
# QUE NO HACE: no publica en TikTok. Publicar sigue siendo una micro-tarea de Claude por pieza
# (motor/PUBLICAR.md, via B), porque la via de Higgsfield es MCP y no tiene API REST documentada.
# Este workflow deja las piezas ALOJADAS y anotadas; publicar es un paso aparte y corto.
#
# CUOTA: el repositorio es PUBLICO, asi que los minutos de Actions no se cobran (hasta el 19/09
# este comentario decia "plan Free en repo privado, 2.000 min/mes", igual que el README, y era
# falso). Una pieza tarda ~3-4 min (pip + TTS + render + los siete controles); diez piezas ~35 min;
# las corridas de rescate salen en menos de un minuto cuando no hay nada que hacer.

on:
  schedule:
    # UTC. Chile es UTC-3 desde el 06/09/2026 (REVISAR en abril de 2027).
    - cron: '0 8 * * *'    # 05:00 Chile - tanda principal, antes de la ranura de las 07:00
    - cron: '0 12 * * *'   # 09:00 Chile - rescate
    - cron: '0 16 * * *'   # 13:00 Chile - rescate
    - cron: '0 20 * * *'   # 17:00 Chile - rescate
  workflow_dispatch:
    inputs:
      fecha:
        description: 'Dia a renderizar (AAAA-MM-DD). Vacio = hoy en Chile.'
        required: false
        default: ''

permissions:
  contents: write          # para commitear estado/<fecha>.json de vuelta

concurrency:
  # Dos corridas a la vez se pisarian el estado y podrian subir la misma pieza dos veces.
  group: render-diario
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Fecha de trabajo (hora de Chile)
        id: dia
        run: |
          FECHA="${{ inputs.fecha }}"
          [ -z "$FECHA" ] && FECHA=$(TZ=America/Santiago date +%F)
          echo "fecha=$FECHA" >> "$GITHUB_OUTPUT"
          echo "Renderizando el dia $FECHA"

      - name: ¿Hay cola para hoy?
        id: cola
        run: |
          COLA="cola/${{ steps.dia.outputs.fecha }}.json"
          if [ ! -f "$COLA" ]; then
            echo "No existe $COLA: la tarea de la manana no dejo tanda. Nada que renderizar."
            echo "hay=no" >> "$GITHUB_OUTPUT"
          else
            echo "hay=si" >> "$GITHUB_OUTPUT"
            echo "cola=$COLA" >> "$GITHUB_OUTPUT"
            python3 -c "import json;print('piezas en la cola:', len(json.load(open('$COLA'))['piezas']))"
          fi

      - name: Python
        if: steps.cola.outputs.hay == 'si'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ffmpeg y fuentes
        if: steps.cola.outputs.hay == 'si'
        run: |
          set -euo pipefail
          sudo apt-get update -q
          # fonts-montserrat la pide reaccion_full.py (rotulo y CTA de las piezas F15);
          # Poppins la pide motor.py (laminas). DejaVu viene siempre y queda de ultimo recurso.
          sudo apt-get install -y -q ffmpeg fonts-noto-color-emoji fonts-montserrat fonts-dejavu-core || \
            sudo apt-get install -y -q ffmpeg fonts-noto-color-emoji fonts-dejavu-core
          mkdir -p _salida/fonts

          # POR QUE ESTE PASO ES DESCONFIADO (19/09/2026):
          # `curl -sL URL -o f` ante un 403 escribe la PAGINA DE ERROR en el archivo y sale con
          # codigo 0. Medido hoy: los tres .ttf de github.com/google/fonts devolvieron 403 y un
          # archivo de 378 bytes. El paso marcaba verde con fuentes falsas dentro, y ffmpeg no
          # dice "esta fuente es un HTML": falla el drawtext y la pieza muere sin explicacion.
          # Por eso aqui toda fuente se COMPRUEBA por tamano antes de darla por buena.
          traer () {   # traer <destino> <url...>
            dst="$1"; shift
            for u in "$@"; do
              curl -sL --max-time 60 -o "$dst" "$u" || true
              if [ -s "$dst" ] && [ "$(stat -c%s "$dst")" -gt 40000 ]; then
                echo "  OK $(basename "$dst") <- $u ($(stat -c%s "$dst") bytes)"; return 0
              fi
            done
            rm -f "$dst"; return 1
          }

          # Montserrat: primero la del sistema (apt), si no, Google Fonts.
          SYS_MONT=$(fc-list 2>/dev/null | grep -i "montserrat" | grep -iE "extrabold|bold" | head -1 | cut -d: -f1 || true)
          if [ -n "$SYS_MONT" ] && [ -s "$SYS_MONT" ]; then
            cp "$SYS_MONT" _salida/fonts/Montserrat-ExtraBold.ttf
            echo "  OK Montserrat <- sistema: $SYS_MONT"
          else
            traer _salida/fonts/Montserrat-ExtraBold.ttf \
              "https://raw.githubusercontent.com/google/fonts/main/ofl/montserrat/static/Montserrat-ExtraBold.ttf" \
              "https://raw.githubusercontent.com/google/fonts/main/ofl/montserrat/Montserrat%5Bwght%5D.ttf" || true
          fi

          for f in Poppins-Bold Poppins-Regular Poppins-SemiBold; do
            traer "_salida/fonts/$f.ttf" \
              "https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/$f.ttf" || true
          done

          # Ultimo recurso: DejaVu, que viene con el sistema. Fea pero real.
          DEJA=$(fc-list 2>/dev/null | grep -i "DejaVuSans-Bold.ttf" | head -1 | cut -d: -f1 || true)
          for f in Montserrat-ExtraBold Poppins-Bold Poppins-Regular Poppins-SemiBold; do
            if [ ! -s "_salida/fonts/$f.ttf" ] && [ -n "$DEJA" ]; then
              cp "$DEJA" "_salida/fonts/$f.ttf"; echo "  SUSTITUIDA $f por DejaVu"
            fi
          done

          echo "--- fuentes finales ---"; ls -l _salida/fonts/
          faltan=0
          for f in Montserrat-ExtraBold Poppins-Bold Poppins-Regular Poppins-SemiBold; do
            if [ ! -s "_salida/fonts/$f.ttf" ] || [ "$(stat -c%s "_salida/fonts/$f.ttf")" -lt 40000 ]; then
              echo "::error::Falta la fuente $f y no hubo con que sustituirla."; faltan=1
            fi
          done
          [ "$faltan" -eq 0 ] || exit 1
          ffmpeg -version | head -1

      - name: Sacar de la tanda lo que ya esta alojado
        id: tanda
        if: steps.cola.outputs.hay == 'si'
        run: |
          # Una corrida de RESCATE no puede re-renderizar lo que ya salio bien. Dos razones, y
          # la segunda es la grave:
          #  1. gasta minutos de runner en piezas que ya estan hechas;
          #  2. ci_registrar intentaria marcar 'renderizado' una ranura que ya esta en 'alojado',
          #     cadena.py lo rechazaria por ser hacia atras -con razon- y la pieza BUENA quedaria
          #     marcada como fallida. El rescate destruiria justo lo que vino a rescatar.
          # La TANDA se escribe aparte y el archivo de la cola NO se toca. La primera version
          # filtraba sobre cola/<fecha>.json y el paso de commit lo subia: la corrida de rescate
          # del 19/09 borro del registro las cuatro piezas buenas que acababa de respetar. La
          # cola es el registro de lo que el dia DEBIA tener; la tanda es lo que toca renderizar
          # ahora. Confundirlas hace que cada rescate amputue el historial del dia.
          mkdir -p _salida
          python3 - "${{ steps.cola.outputs.cola }}" "${{ steps.dia.outputs.fecha }}" _salida/tanda.json <<'PY'
          import json, sys
          sys.path.insert(0, "motor")
          import cadena as C
          ruta, fecha, destino = sys.argv[1], sys.argv[2], sys.argv[3]
          cola = json.load(open(ruta, encoding="utf-8"))
          dia = C.cargar(fecha, obligatorio=False)
          antes = len(cola["piezas"])
          if dia:
              # Por nombre y no por indice: 'fallido' no esta en la cadena y C.indice() reventaria.
              HECHO = ("alojado", "programado", "publicado")
              hechas = {q["slot"] for q in dia["piezas"] if q["estado"] in HECHO}
              cola["piezas"] = [p for p in cola["piezas"] if p.get("slot") not in hechas]
          with open(destino, "w", encoding="utf-8") as f:
              json.dump(cola, f, ensure_ascii=False, indent=1)
          print("tanda: %d en la cola, %d ya alojadas que se saltan, %d por renderizar"
                % (antes, antes - len(cola["piezas"]), len(cola["piezas"])))
          PY
          echo "tanda=_salida/tanda.json" >> "$GITHUB_OUTPUT"

      - name: Verificar el derecho contra LeyChile
        if: steps.cola.outputs.hay == 'si'
        id: derecho
        continue-on-error: true
        run: |
          # Este es el unico punto de la cadena con red hacia LeyChile Y con poder de bloquear.
          # El contenedor donde corren las tareas NO lo alcanza (el proxy de egress responde
          # connect_rejected, medido el 19/09), asi que al encolar no se puede verificar de
          # verdad. Aqui si, y antes de gastar un solo minuto de render.
          python3 motor/leychile.py --cola "${{ steps.tanda.outputs.tanda }}" | tee _derecho.txt

      - name: Parar las piezas cuya cita legal no cuadra
        if: steps.cola.outputs.hay == 'si' && steps.derecho.outcome == 'failure'
        run: |
          echo "::warning::Hay piezas con cita legal falsa o no verificable; no se renderizan."
          python3 - "${{ steps.tanda.outputs.tanda }}" "${{ steps.dia.outputs.fecha }}" <<'PY'
          import json, re, subprocess, sys
          ruta, fecha = sys.argv[1], sys.argv[2]
          cola = json.load(open(ruta, encoding="utf-8"))
          informe = open("_derecho.txt", encoding="utf-8").read()
          malas = dict(re.findall(r"#(\d+)\s+\S+\s+norma\s+\S+\s+art\s+\S+\s+(FALSA|NO VERIFICABLE)",
                                  informe))
          for slot, veredicto in malas.items():
              subprocess.run([sys.executable, "motor/cadena.py", "fallar", slot, "--fecha", fecha,
                              "--motivo", "cita legal %s (motor/leychile.py): no se renderiza"
                                          % veredicto])
          cola["piezas"] = [p for p in cola["piezas"] if str(p.get("slot")) not in malas]
          with open(ruta, "w", encoding="utf-8") as f:
              json.dump(cola, f, ensure_ascii=False, indent=1)
          print("paradas %d piezas; quedan %d para renderizar" % (len(malas), len(cola["piezas"])))
          PY

      - name: Renderizar la tanda
        if: steps.cola.outputs.hay == 'si'
        env:
          # PRODUCE_LOCAL hace que produce.py use el codigo de ESTE checkout y no el de `main`:
          # sin esto, un arreglo en rama se renderizaria con el motor viejo sin avisar.
          PRODUCE_LOCAL: ${{ github.workspace }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          cp "${{ steps.tanda.outputs.tanda }}" _salida/job.json
          cd _salida
          # produce.py hace todo: deps, pip, gancho, voz, karaoke, motor, los siete controles
          # y el PUT a la upload_url. No sube nada que control.py no haya aprobado.
          python3 "$GITHUB_WORKSPACE/motor/produce.py" job.json 2>&1 | tail -60
        continue-on-error: true      # una pieza mala no puede llevarse la tanda entera

      - name: Alojar los mp4 como Release
        id: alojar
        if: steps.cola.outputs.hay == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # POR QUE AQUI Y NO CON UNA upload_url PRESIGNADA DE HIGGSFIELD:
          # esa url mide ~2.400 caracteres y la escribia A MANO la sesion que armaba la cola,
          # caracter por caracter. Diez piezas al dia son 24.000 caracteres transcritos sin
          # equivocarse ni una vez; un solo caracter malo invalida la firma y pierde la pieza.
          # La url de una Release es corta, publica, no caduca y no la copia nadie.
          TAG="piezas-${{ steps.dia.outputs.fecha }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Piezas ${{ steps.dia.outputs.fecha }}" \
              --notes "mp4 del dia, subidos por render-diario. Se regeneran: no son un respaldo."
          subidos=0
          for f in _salida/*.mp4; do
            [ -e "$f" ] || continue
            gh release upload "$TAG" "$f" --clobber && subidos=$((subidos+1))
          done
          echo "subidos $subidos mp4 a la release $TAG"
          echo "base=https://github.com/${{ github.repository }}/releases/download/$TAG" >> "$GITHUB_OUTPUT"

          # OJO, MEDIDO EL 19/09: esta url NO sirve para `media_import_url` de Higgsfield, y no
          # es culpa de como se sube. GitHub GUARDA bien el tipo -la API dice video/mp4 en los 24
          # assets del dia- pero al servir el archivo fuerza en la url firmada
          #     response-content-type=application/octet-stream
          # y Higgsfield responde "Unsupported content-type: application/octet-stream". El que
          # sube no puede cambiarlo: es como GitHub entrega TODOS los assets de una Release.
          # Por eso las piezas se suben a Higgsfield ANTES de su hora y el libro de cuentas se
          # queda con el media_id (motor/PUBLICAR.md). Esta Release sigue siendo util: es de
          # donde la pre-subida saca los bytes, y para curl el tipo servido da igual.

      - name: Anotar en el libro de cuentas
        if: steps.cola.outputs.hay == 'si'
        run: |
          python3 motor/ci_registrar.py \
            --cola "${{ steps.tanda.outputs.tanda }}" \
            --resultado _salida/resultado.json \
            --base-url "${{ steps.alojar.outputs.base }}" \
            --fecha "${{ steps.dia.outputs.fecha }}" || true

      - name: Auditar el dia
        if: steps.cola.outputs.hay == 'si'
        run: python3 motor/cadena.py auditar --fecha "${{ steps.dia.outputs.fecha }}" || true

      - name: Commitear el estado
        if: steps.cola.outputs.hay == 'si'
        run: |
          git config user.name  "render-diario"
          git config user.email "actions@github.com"
          git add estado/ || true   # cola/ NO: es el registro del dia y el render no lo edita
          if git diff --cached --quiet; then
            echo "Sin cambios en el estado."
          else
            git commit -m "render diario ${{ steps.dia.outputs.fecha }}: estado actualizado por Actions"
            # Otra corrida pudo empujar mientras esta renderizaba: reintentar con rebase.
            for i in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              echo "reintento $i"; sleep $((i*5))
            done
          fi

      - name: Guardar los mp4 por si hay que revisarlos
        if: steps.cola.outputs.hay == 'si'
        uses: actions/upload-artifact@v4
        with:
          name: piezas-${{ steps.dia.outputs.fecha }}
          path: |
            _salida/*.mp4
            _salida/resultado.json
          retention-days: 3
          if-no-files-found: warn
